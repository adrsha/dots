# "$schema" = 'https://starship.rs/config-schema.json'

format = """
[](8)\
$git_branch\
$git_status\
[](fg:8 bg:2)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:2 bg:8)\
$time\
[](fg:8 bg:9)\
$directory\
[](fg:9 bg:0) 
 [ ](fg:2) 
"""

# Disable the blank line at the start of the prompt
add_newline = true

[username]
show_always = true
style_user = "bg:8"
style_root = "bg:8"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:16"
disabled = true

[directory]
style = "bg:9"
format = "[ $path ]($style)"
truncate_to_repo = false
truncation_length = 0
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Codes" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:6"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:8"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:8"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:2"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:8"
format = '[ $time ]($style)'
