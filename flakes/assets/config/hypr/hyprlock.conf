# Hyprlock performs password authentication; Quickshell only launches it.
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/chilly/Pictures/walls/warm/tablet.jpg
    blur_passes = 2
    blur_size = 5
    color = rgba(141524ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f0edfaff)
    font_size = 82
    font_family = sans-serif
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(d9d2eaff)
    font_size = 20
    font_family = sans-serif
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Enter password to unlock</i>
    font_family = sans-serif
    inner_color = rgba(1a1c2be8)
    outer_color = rgba(bca9faff)
    font_color = rgba(f0edfaff)
    check_color = rgba(8abfb9ff)
    fail_color = rgba(ea7c8bff)
    position = 0, -92
    halign = center
    valign = center
}
