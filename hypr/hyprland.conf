##################################################
# Hyprland Configuration for Nvidia 4070 Super
# 
# This configuration is optimized for performance and 
# visual quality on Nvidia RTX 4070 Super GPU
##################################################

#=================================================
# THEME COLORS
# Generated by set_theme.fish — do not edit manually.
# To change: source ~/dots/themes/set_theme.fish ~/dots/themes/<name>
#=================================================

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/quickshell-shortcuts.conf
source = ~/.config/hypr/quickshell-glass.conf

#=================================================
# MONITOR CONFIGURATION
#=================================================

monitor = HDMI-A-1,1920x1080@180,0x0,1 
# monitor=HDMI-2,1920x1080@180,auto,1

#=================================================
# APPLICATIONS AND STARTUP
#=================================================

$terminal = ghostty

env = GTK_THEME,QuickshellSync

exec-once = xset r rate 700 25
exec-once = vicinae server
exec-once = ~/Scripts/breaks.py
exec-once = hyprctl setcursor "oreo_black_cursors" 24
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = awww-daemon
exec-once = theme-daemon
exec-once = qs -d

#=================================================
# GENERAL SETTINGS
#=================================================

general { 
    gaps_in          = 2
    gaps_out         = 8
    gaps_workspaces  = 0

    resize_on_border = true
    layout           = dwindle
}

#=================================================
# DECORATION SETTINGS
#=================================================

decoration {
    shadow {
      enabled          = false
      color            = rgba(00000055)
      color_inactive   = rgba(00000055)
      range            = 30
      scale            = 1
    }

    active_opacity   = 1
    inactive_opacity = 1

    dim_inactive = true
    dim_strength = 0.1

    blur {
        enabled           = true
        size              = 5
        passes            = 3
        ignore_opacity    = true
        new_optimizations = true
        xray              = false
    }
}

#=================================================
# ANIMATIONS
#=================================================

animations {
    enabled = true
    
    bezier = myBezier,  0.05, 0.9,  0.1,  1.05
    bezier = smoothOut, 0.36, 0,    0.66, -0.56
    bezier = smoothIn,  0.25, 1,    0.5,  1
    
    animation = windows,     1, 5, myBezier,  slide
    animation = windowsOut,  1, 4, smoothOut
    animation = windowsMove, 1, 5, myBezier,  slide
    animation = border,      1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade,        1, 4, smoothIn
    animation = fadeIn,      1, 4, default
    animation = fadeOut,     1, 4, default
    animation = fadeSwitch,  1, 4, default
    animation = fadeShadow,  1, 4, default
    animation = fadeDim,     1, 4, default
    animation = fadeLayers,  1, 4, default
    animation = workspaces,  1, 3, smoothIn, slidevert
}

#=================================================
# LAYOUT SETTINGS
#=================================================

dwindle {
    preserve_split       = true
    force_split          = 2
    default_split_ratio  = 1
}

master {
    new_status = master
}

#=================================================
# XWAYLAND SETTINGS
#=================================================

xwayland {
    force_zero_scaling = true
}

#=================================================
# CURSOR SETTINGS
#=================================================

cursor {
    persistent_warps         = true
    warp_on_change_workspace = true
    zoom_factor              = 1
}

#=================================================
# DEBUG SETTINGS
#=================================================

debug {
    error_position = 1
}

#=================================================
# MISCELLANEOUS SETTINGS
#=================================================

misc { 
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true

    font_family                  = Adwaita Mono Nerd Font
    layers_hog_keyboard_focus    = true
    animate_manual_resizes       = true
    animate_mouse_windowdragging = true
    disable_splash_rendering     = true,

    enable_swallow             = false
    focus_on_activate          = false
    initial_workspace_tracking = true
    close_special_on_empty     = true
}

#=================================================
# INPUT SETTINGS
#=================================================

input {
    kb_layout    = us
    repeat_rate  = 45
    repeat_delay = 300
    
    follow_mouse = 1
    sensitivity  = -0.55
    accel_profile = flat
}

#=================================================
# KEY BINDINGS
#=================================================

bind = SUPER, return,     exec, $terminal
bind = SUPER SHIFT, return, exec, alacritty
bind = SUPER, Q,          killactive,
bind = SUPER, W,          exec, ~/Scripts/waybar_restart.sh
bind = SUPER, W,          exec, nix run ~/Codes/ollama
# bind = SUPER, R, exec, 
bind = SUPER, period,     exec, emote
bind = SUPER, X,        exit,
bind = SUPER SHIFT, X,  exec, poweroff
bind = SUPER SHIFT, R, exec, reboot
bind = SUPER, S,          togglefloating,
bind = ALT SHIFT, space,  exec, ~/Scripts/run
bind = ALT, space,        exec, vicinae toggle
bind = SUPER, F,          fullscreen, 0
bind = SUPER SHIFT, F,    fullscreen, 0
bind = SUPER SHIFT, S,    pseudo,
bindd = SUPER, T,         $d toggle split, layoutmsg, togglesplit
bind = SUPER SHIFT CTRL, L, exec, ~/Scripts/lockHypr

binde = SUPER CTRL, h, resizeactive, -20 0
binde = SUPER CTRL, l, resizeactive,  20 0
binde = SUPER CTRL, k, resizeactive,  0 -20
binde = SUPER CTRL, j, resizeactive,  0  20

binde = SUPER SHIFT, h, movewindow, l
binde = SUPER SHIFT, l, movewindow, r
binde = SUPER SHIFT, k, movewindow, u
bind  = SUPER SHIFT, j, movewindow, d

bind = SUPER, A,      exec, /home/chilly/Scripts/notifs.sh date && /home/chilly/Scripts/notifs.sh time
bindt = SUPER, escape, exec, hyprctl kill

bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER, u, workspace, 1
bind = SUPER, i, workspace, 2
bind = SUPER, o, workspace, 3

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, e, exec, unset DISPLAY && emacsclient -c
bind = SUPER SHIFT, e, exec, ~/Scripts/emacsRestart.sh
bind = SUPER SHIFT, c, exec, hyprpicker -a
bind = , Print,        exec, qs ipc call shell toggleScreenshot
bind = SUPER, Print,   exec, qs ipc call shell screenshot window save
bind = SHIFT, Print,   exec, qs ipc call shell screenshot output save
bind = CTRL, Print,    exec, qs ipc call shell screenshot region lens

bind = SUPER, g,   togglegroup
bind = SUPER, tab, changegroupactive
bind = SUPER SHIFT, b, exec, firefox

binde = SUPER, space,       togglespecialworkspace, scratchpad
bind  = SUPER SHIFT, space, movetoworkspace,        special:scratchpad

binde = SUPER, d,       togglespecialworkspace, dashboard
bind  = SUPER SHIFT, d, movetoworkspace,        special:dashboard

bind = SUPER, p, workspace, e-1
bind = SUPER, n, workspace, e+1

bindm = SUPER,       mouse:272, movewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

binde = , XF86AudioRaiseVolume,  exec, qs ipc call shell changeVolume 5
binde = , XF86AudioLowerVolume,  exec, qs ipc call shell changeVolume -- -5
binde = SUPER, UP,               exec, qs ipc call shell changeVolume 5
binde = SUPER, DOWN,             exec, qs ipc call shell changeVolume -- -5
# binde = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# binde = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# binde = SUPER, UP,               exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# binde = SUPER, DOWN,             exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioPlay,         exec, playerctl play-pause
bind  = , XF86AudioNext,         exec, playerctl next
bind  = , XF86AudioPrev,         exec, playerctl previous
binde = SUPER, LEFT,             exec, qs ipc call shell changeBrightness 5
binde = SUPER, RIGHT,            exec, qs ipc call shell changeBrightness -- -5
binde = , XF86MonBrightnessDown, exec, qs ipc call shell changeBrightness 5
binde = , XF86MonBrightnessUp,   exec, qs ipc call shell changeBrightness -- -5
# binde = SUPER, LEFT,             exec, ddcutil --display 1 setvcp 10 - 10
# binde = SUPER, RIGHT,            exec, ddcutil --display 1 setvcp 10 + 10
# binde = , XF86MonBrightnessDown, exec, ddcutil --display 1 setvcp 10 - 10
# binde = , XF86MonBrightnessUp,   exec, ddcutil --display 1 setvcp 10 + 10

#=================================================
# WINDOW RULES
#=================================================
windowrule {
  name = ueberzug-float
  match:class = ueberzugpp_.*
  float = true
}

windowrule {
  name = ueberzug-nofocus
  match:class = ueberzugpp_.*
  no_initial_focus = true
}

#=================================================
# LAYER RULES
#=================================================

layerrule = dim_around on, match:namespace vicinae
